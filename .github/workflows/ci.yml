name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Resolve pinned packages
        run: swift package resolve
      - name: Build
        run: swift build --configuration debug
      - name: Test
        run: swift test --parallel
