name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
      - name: Swift version
        run: swift --version
      - name: Resolve pinned packages
        run: swift package resolve
      - name: Build
        run: swift build --configuration debug
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/macmcp-swift-test.log"
          set +e
          swift test 2>&1 | tee "$output"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" -ne 0 ]]; then
            failure="$(grep -E -m1 'Test Case .* failed|error:|fatal error:' "$output" || true)"
            printf '::error title=MacMCP Swift test failure::%s\n' \
              "${failure:-swift test exited with status $status}"
            exit "$status"
          fi
      - name: Local deployment acceptance
        run: scripts/verify-local-deployment.sh
      - name: Homebrew source formula acceptance
        shell: bash
        run: |
          brew tap-new --no-git macmcp-ci/local
          tap_dir="$(brew --repository macmcp-ci/local)"
          cp Formula/macmcp.rb "$tap_dir/Formula/macmcp.rb"
          brew install --build-from-source macmcp-ci/local/macmcp
          brew test macmcp-ci/local/macmcp
